<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Rounded Branded Background -->
  <rect width="64" height="64" rx="16" fill="url(#bookGrad)"/>
  
  <!-- Open Book Pages -->
  <path d="M14 44c6-3 12-3 18 1V22c-6-4-12-4-18-1v23z" fill="#ffffff" opacity="0.95"/>
  <path d="M50 44c-6-3-12-3-18 1V22c6-4 12-4 18-1v23z" fill="#e2e8f0" opacity="0.9"/>
  <line x1="32" y1="23" x2="32" y2="45" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Leaf emerging from spine (BookLeaf Motif) -->
